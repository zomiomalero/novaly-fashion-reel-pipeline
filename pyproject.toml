[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novaly-fashion-reels"
version = "2.0.0"
description = "Reproducible photorealistic fashion reel production with prompt packs, FFmpeg editing and frame QA."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Novaly Studio"}]
dependencies = ["Pillow>=10.0", "numpy>=1.24"]

[project.scripts]
fashionreel = "fashionreel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
